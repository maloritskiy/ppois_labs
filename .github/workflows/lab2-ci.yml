name: C++ CI

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: write

jobs:
  build-test:
    name: Build, unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install coverage tool
        run: sudo apt-get update && sudo apt-get install -y gcovr

      - name: Build program and run tests
        run: make -C lab2 clean all test coverage

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: audio-collection-linux
          path: lab2/audio_collection_cli

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: >-
          cppcheck --enable=warning,performance,portability
          --error-exitcode=1 --suppress=missingIncludeSystem --std=c++17
          lab2/audio_*.hpp lab2/main.cpp lab2/tests.cpp

  release:
    name: Publish release artifact
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test, static-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build release executable
        run: make -C lab2 release

      - name: Package executable
        run: |
          mkdir -p release-package
          cp lab2/audio_collection_cli_release release-package/audio_collection_cli
          cp lab2/README.md release-package/
          tar -czf audio-collection-${GITHUB_REF_NAME}-linux.tar.gz -C release-package .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: audio-collection-${{ github.ref_name }}-linux.tar.gz
          generate_release_notes: true
