name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab1
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgtest-dev
          pip install gcovr
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DLAB1_ENABLE_COVERAGE=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
      - name: Check coverage (at least 90%)
        run: gcovr --root . --filter 'src/' --filter 'include/' --fail-under-line 90 --print-summary

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Static analysis
        run: >
          cppcheck --enable=warning,performance,portability --inline-suppr
          --error-exitcode=1 -I lab1/include lab1/src lab1/apps

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build release binaries
        run: |
          sudo apt-get update && sudo apt-get install -y cmake g++
          cmake -S lab1 -B build -DCMAKE_BUILD_TYPE=Release -DLAB1_BUILD_TESTS=OFF
          cmake --build build --parallel
      - name: Package
        run: tar -czf lab1-linux-x64.tar.gz -C build set_app fifteen_app
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: lab1-linux-x64.tar.gz
